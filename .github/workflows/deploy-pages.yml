name: Deploy Cardano Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Gerar frontend estático
        env:
          CARDANO_API_URL: ${{ vars.CARDANO_API_URL }}
        run: |
          bun install --frozen-lockfile
          bun run pages:build
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
